plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 版本号唯一来源：根目录 version.properties
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def appVersionName = versionProps.getProperty('VERSION_NAME', '1.0.0')
def appVersionCode = versionProps.getProperty('VERSION_CODE', '1').toInteger()

android {
    namespace 'com.r.chatvault'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.r.chatvault'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // APK 文件名带版本号，避免不同版本互相覆盖
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def fileName = output.outputFileName
            if (fileName != null && fileName.endsWith('.apk')) {
                output.outputFileName = "ChatVault-${appVersionName}-${variant.buildType.name}.apk"
            }
        }
    }
}

// 按版本隔离产物：assemble 后把 APK 收进 dist/v<版本号>/
tasks.register('collectApk', Copy) {
    from layout.buildDirectory.dir('outputs/apk')
    include '**/*.apk'
    includeEmptyDirs = false
    into rootProject.file("dist/v${appVersionName}")
    eachFile { details -> details.path = details.name }
}

tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'collectApk'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
