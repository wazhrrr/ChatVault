org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 网络不稳时放宽下载超时并重试（国内访问 dl.google.com 经常读超时）
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

# 卡在 aapt2 下载（Read timed out）时的绕过方案：指向本机 SDK 的 aapt2
# 网络正常、或换机器没有该文件时，删掉/注释掉下面这行即可回到在线下载
# android.aapt2FromMavenOverride=/path/to/Android/Sdk/build-tools/36.0.0/aapt2.exe

# 工程位于含中文的路径时，关闭 AGP 的路径检查（更推荐放在纯英文路径下构建）
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
